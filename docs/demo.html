<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 AI Race Engineer — Standalone Console Demo (Nothing Design System)</title>
  <!-- Google Fonts: Doto, Space Grotesk, Space Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Doto:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet"
  />

  <style>
    /* Nothing Design System Tokens */
    :root, [data-theme="light"] {
      --black: #F5F5F5;
      --surface: #FFFFFF;
      --surface-raised: #F0F0F0;
      --border: #E8E8E8;
      --border-visible: #CCCCCC;
      --text-disabled: #999999;
      --text-secondary: #666666;
      --text-primary: #1A1A1A;
      --text-display: #000000;
      --accent: #D71921;
      --accent-subtle: rgba(215, 25, 33, 0.12);
      --success: #4A9E5C;
      --warning: #D4A843;
      --font-display: "Doto", "Space Mono", monospace;
      --font-body: "Space Grotesk", system-ui, sans-serif;
      --font-mono: "Space Mono", monospace;
      --radius-card: 10px;
      --radius-technical: 4px;
      --radius-pill: 999px;
      --transition-fast: 150ms cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    [data-theme="dark"] {
      --black: #000000;
      --surface: #111111;
      --surface-raised: #1A1A1A;
      --border: #222222;
      --border-visible: #333333;
      --text-disabled: #666666;
      --text-secondary: #999999;
      --text-primary: #E8E8E8;
      --text-display: #FFFFFF;
      --accent-subtle: rgba(215, 25, 33, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-visible); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

    body {
      background-color: var(--black);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.45;
      height: 100vh;
      overflow: hidden;
    }

    @media (max-width: 1199px) { body { height: auto; overflow-y: auto; } }

    /* Header */
    .app-header {
      height: 52px;
      border-bottom: 1px solid var(--border-visible);
      background-color: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .brand-section { display: flex; align-items: center; gap: 8px; }
    .brand-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-display);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .brand-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      border: 1px solid var(--border-visible);
      padding: 2px 6px;
      border-radius: var(--radius-technical);
    }

    .header-controls { display: flex; align-items: center; gap: 12px; }
    .track-clock {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: var(--radius-technical);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .track-clock-live { width: 6px; height: 6px; background-color: var(--success); border-radius: 50%; }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-secondary);
    }
    .select-input {
      background-color: var(--surface-raised);
      border: 1px solid var(--border-visible);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: var(--radius-technical);
      outline: none;
      cursor: pointer;
    }

    .btn-toggle-theme {
      background: transparent;
      border: 1px solid var(--border-visible);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition-fast);
    }
    .btn-toggle-theme:hover { border-color: var(--text-display); color: var(--text-display); }

    /* Layout */
    .main-console {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 12px;
      padding: 8px 16px 12px 16px;
      max-width: 1920px;
      margin: 0 auto;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    @media (max-width: 1199px) { .main-console { grid-template-columns: 1fr; height: auto; overflow-y: visible; } }

    .deck { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; overflow: hidden; }
    @media (max-width: 1199px) { .deck { height: auto; overflow: visible; } }

    .card {
      background-color: var(--surface);
      border: 1px solid var(--border-visible);
      border-radius: var(--radius-card);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      flex-shrink: 0;
    }
    .card-title {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; color: var(--text-disabled); }

    /* Stepper Buttons */
    .corner-strip { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding-bottom: 2px; flex-shrink: 0; }
    .corner-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border-radius: var(--radius-technical);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-fast);
    }
    .corner-btn:hover { border-color: var(--border-visible); color: var(--text-primary); }
    .corner-btn.active { background-color: var(--text-display); color: var(--black); border-color: var(--text-display); font-weight: 700; }

    /* Telemetry Columns */
    .teammate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex-shrink: 0; }
    .telemetry-column {
      background-color: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .driver-tag-row { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
    .driver-code { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--text-display); }
    .corner-style-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-visible);
      color: var(--text-primary);
    }

    .hero-metric { display: flex; flex-direction: column; gap: 1px; }
    .hero-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
    .hero-value-wrap { display: flex; align-items: baseline; gap: 4px; }
    .hero-value { font-family: var(--font-display); font-size: 32px; font-weight: 700; color: var(--text-display); line-height: 1; }
    .hero-unit { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
    .hero-spread { font-family: var(--font-mono); font-size: 11px; color: var(--text-disabled); }

    /* Segmented Bar */
    .seg-bar-wrap { display: flex; flex-direction: column; gap: 3px; }
    .seg-bar-header { display: flex; align-items: center; justify-content: space-between; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
    .seg-bar { display: flex; gap: 2px; width: 100%; height: 6px; }
    .seg-block { flex: 1; background-color: var(--border); border-radius: 0; }
    .seg-block.filled { background-color: var(--text-display); }

    .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; }
    .stat-row:last-child { border-bottom: none; }
    .stat-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
    .stat-value { font-size: 11px; color: var(--text-display); font-weight: 700; }

    /* Segmented Control Tabs */
    .segmented-nav-tabs {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-visible);
      border-radius: var(--radius-pill);
      padding: 2px;
      background-color: var(--surface-raised);
    }
    .nav-tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .nav-tab-btn:hover { color: var(--text-primary); }
    .nav-tab-btn.active { background-color: var(--text-display); color: var(--black); font-weight: 700; }

    .table-scroll-container { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }

    /* Tables */
    .data-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
    .data-table th {
      position: sticky; top: 0; background-color: var(--surface);
      text-align: left; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary);
      padding: 6px 8px; border-bottom: 1px solid var(--border-visible); z-index: 2;
    }
    .data-table th.num, .data-table td.num { text-align: right; }
    .data-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text-primary); }
    .data-table tr.active-row { background-color: var(--surface-raised); border-left: 2px solid var(--accent); }

    .delta-badge { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; padding: 1px 6px; border-radius: var(--radius-technical); display: inline-block; }
    .delta-badge.significant { background-color: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent); }
    .delta-badge.neutral { border: 1px solid var(--border); color: var(--text-disabled); }

    .clipping-signal { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; border-radius: var(--radius-pill); }
    .clipping-signal.active { background-color: var(--accent-subtle); color: var(--accent); border: 1px solid var(--accent); }
    .signal-dot { width: 5px; height: 5px; border-radius: 50%; background-color: currentColor; }

    /* Intercom */
    .intercom-container { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
    .messages-stream { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; }
    .message-item { display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; border-radius: 6px; font-size: 12px; line-height: 1.4; }
    .message-item.user { background-color: var(--surface-raised); border: 1px solid var(--border-visible); align-self: flex-end; max-width: 85%; }
    .message-item.assistant { background-color: var(--surface); border: 1px solid var(--border); align-self: flex-start; max-width: 95%; }
    .message-meta { display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); }
    .message-meta .badge-grounded { color: var(--success); border: 1px solid var(--success); padding: 0 4px; border-radius: 2px; }
    .message-text { color: var(--text-primary); font-family: var(--font-body); }

    .quick-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; flex-shrink: 0; }
    .chip-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; padding: 3px 8px; border-radius: var(--radius-pill); cursor: pointer; transition: var(--transition-fast);
    }
    .chip-btn:hover { border-color: var(--border-visible); color: var(--text-primary); }

    .input-bar { display: flex; gap: 6px; margin-top: 6px; flex-shrink: 0; }
    .chat-input {
      flex: 1; background-color: var(--surface-raised); border: 1px solid var(--border-visible);
      color: var(--text-display); font-family: var(--font-mono); font-size: 11px; padding: 6px 12px; border-radius: var(--radius-pill); outline: none;
    }
    .chat-input:focus { border-color: var(--text-display); }
    .btn-send {
      background-color: var(--text-display); color: var(--black); border: none; font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 700; padding: 0 14px; border-radius: var(--radius-pill); cursor: pointer; transition: var(--transition-fast);
    }
    .btn-send:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="brand-section">
      <div class="brand-title">
        <span>●</span>
        <span>F1 AI RACE ENGINEER</span>
      </div>
      <span class="brand-badge">V2.0 / STANDALONE DEMO</span>
    </div>

    <div class="header-controls">
      <div class="track-clock">
        <span class="track-clock-live"></span>
        <span>TRACK UTC: <strong id="utc-clock">--:--:--</strong></span>
      </div>

      <div class="select-wrapper">
        <label for="session-select">SESSION:</label>
        <select id="session-select" class="select-input">
          <option value="2026_01_R" selected>2026_01_R (Australian GP - Race)</option>
          <option value="2026_01_FP2">2026_01_FP2 (Australian GP - FP2)</option>
        </select>
      </div>

      <div class="select-wrapper">
        <label for="team-select">CONSTRUCTOR:</label>
        <select id="team-select" class="select-input">
          <option value="McLaren" selected>McLaren [PIA / NOR]</option>
          <option value="Ferrari">Ferrari [LEC / HAM]</option>
          <option value="Mercedes">Mercedes [RUS / ANT]</option>
          <option value="Red Bull Racing">Red Bull [VER / LAW]</option>
          <option value="Williams">Williams [ALB / SAI]</option>
          <option value="Audi">Audi [HUL / BOR]</option>
          <option value="Cadillac">Cadillac [BOT / PER]</option>
        </select>
      </div>

      <div class="select-wrapper">
        <label for="run-type-select">RUN:</label>
        <select id="run-type-select" class="select-input">
          <option value="long_run" selected>LONG RUN (RACE SIM)</option>
          <option value="push">PUSH (QUALIFYING)</option>
        </select>
      </div>

      <button id="theme-toggle-btn" class="btn-toggle-theme">
        <span id="theme-icon">☾</span>
        <span id="theme-label">[ DARK ]</span>
      </button>
    </div>
  </header>

  <!-- Dual-Deck Main Console -->
  <main class="main-console">
    <!-- LEFT DECK: Telemetry & Strategy -->
    <section class="deck">
      <!-- 1. Corner Telemetry Instrument -->
      <div class="card" style="flex-shrink: 0; max-height: 380px;">
        <div class="card-header">
          <div class="card-title">
            <span>[ CORNER TELEMETRY INSTRUMENT ]</span>
          </div>
          <div class="card-meta">
            ACTIVE: <span id="active-corner-label">T1</span>
          </div>
        </div>

        <!-- Ordered Unique Corners T1 through T14 -->
        <div class="corner-strip" id="corner-strip"></div>

        <!-- Teammate Side-by-Side Comparison -->
        <div class="teammate-grid" id="teammate-grid"></div>
      </div>

      <!-- 2. Telemetry & Strategy Analyzer (Tabs) -->
      <div class="card" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
        <div class="card-header">
          <div class="card-title">
            <span>[ TELEMETRY & STRATEGY ANALYZER ]</span>
          </div>

          <div class="segmented-nav-tabs">
            <button class="nav-tab-btn active" data-tab="segments">SEGMENTS</button>
            <button class="nav-tab-btn" data-tab="tyre">TYRE DEG</button>
            <button class="nav-tab-btn" data-tab="energy">2026 ENERGY</button>
            <button class="nav-tab-btn" data-tab="replay" style="color: var(--accent); font-weight: 700;">● RACE REPLAY</button>
          </div>
        </div>

        <div class="table-scroll-container" id="analyzer-content"></div>
      </div>
    </section>

    <!-- RIGHT DECK: Debrief & AI Intercom -->
    <section class="deck">
      <!-- 1. Post-Session Debrief Card -->
      <div class="card" style="flex-shrink: 0; max-height: 250px; overflow-y: auto;" id="debrief-card"></div>

      <!-- 2. AI Race Engineer Intercom -->
      <div class="card intercom-container">
        <div class="card-header">
          <div class="card-title">
            <span id="intercom-title">[ AI RACE ENGINEER INTERCOM ]</span>
          </div>
          <div class="card-meta">
            <span class="status-tag">[ RADIO CHANNEL OPEN ]</span>
          </div>
        </div>

        <div class="messages-stream" id="messages-stream"></div>
        <div class="quick-chips" id="quick-chips"></div>

        <div class="input-bar">
          <input type="text" id="chat-input" class="chat-input" placeholder="Transmit inquiry to race engineer..." />
          <button id="send-btn" class="btn-send">[ SEND ]</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Embedded Data Models for Melbourne 2026 FP2 & Race
    const TEAMS_DATA = {

        ],
        energy: [
          { straight: "start_straight", drv: "RUS", vPeak: 319.5, lateLoss: 5.4, clip: false },
          { straight: "straight_after_T8", drv: "ANT", vPeak: 318.2, lateLoss: 6.2, clip: false }
        ]
      },
      "Williams": {
        drivers: ["ALB", "SAI"],
        cornerStyle: ["V-style", "U-style"],
        debrief: {

    function sendChat(text) {
      const stream = document.getElementById("messages-stream");
      const timeStr = new Date().toUTCString().slice(17, 25);
      
      // User message
      stream.innerHTML += `
        <div class="message-item user">
          <div class="message-meta"><span>[ PIT WALL / ${state.currentTeam} ]</span><span>${timeStr}</span></div>
          <div class="message-text">${text}</div>
        </div>
      `;

      // Simulated grounded race engineer response
      setTimeout(() => {
        const teamInfo = TEAMS_DATA[state.currentTeam] || TEAMS_DATA["McLaren"];
        const [d1, d2] = teamInfo.drivers;
        let reply = "";

        if (text.includes("Compare") && text.includes("apex")) {
          reply = `In ${state.selectedCorner}, ${d1} carries a minimum apex speed of 165 km/h (IQR ±2.4 km/h) anchoring 78.9m before corner, while ${d2} achieves 161 km/h (IQR ±3.0 km/h) braking at 94.4m before corner. Delta is +4 km/h favoring ${d1} due to earlier rotation.`;
        } else if (text.includes("tyre") || text.includes("degradation")) {
          reply = `Theil-Sen fuel-corrected regression indicates ${d1} loses 0.025 s/lap on Hard compound over 22 laps (residual std 0.14s), compared to ${d2} losing 0.027 s/lap. Pace delta remains stable within 0.05s spread.`;
        } else if (text.includes("clipping") || text.includes("energy")) {
          reply = `Straight-line analysis detects speed loss of -12.8 km/h at full throttle before braking zone on straight_after_T8, triggering clipping flag (State of Charge depletion). Aerodynamic drag accounts for only 2.1 km/h.`;
        } else {
          reply = `Telemetry facts confirm largest teammate gap occurs in segment ${state.selectedCorner}-${CORNERS[(CORNERS.indexOf(state.selectedCorner)+1)%14]} with a statistically significant delta of +0.142s. Setup telemetry confirms stable mechanical platform.`;
        }

        stream.innerHTML += `
          <div class="message-item assistant">
            <div class="message-meta"><span>[ RACE ENGINEER ]</span><span>${new Date().toUTCString().slice(17, 25)}</span><span class="badge-grounded">[GROUNDED]</span></div>
            <div class="message-text">${reply}</div>
          </div>
        `;
        stream.scrollTop = stream.scrollHeight;
      }, 400);

      stream.scrollTop = stream.scrollHeight;
    }

    document.getElementById("send-btn").addEventListener("click", () => {
      const input = document.getElementById("chat-input");
      if (input.value.trim()) {
        sendChat(input.value.trim());
        input.value = "";
      }
    });

    document.getElementById("chat-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.target.value.trim()) {
